=s)&&s!=="随時")s="未設定";return{o:o,c:catOf(cat),g:grp,n:n,m:m,s:s,raw:st,due:isISO(due)?due:null,dueT:isISO(due)?"":txt(due),done:done,doneDate:doneDate,routine:routine,key:keyOf(n)}}let MONTHS=[];function build(raw){const ids=Object.keys(raw).map(s=>s.trim()).filter(s=>/^\d{4}$/.test(s)).sort();const byId={};Object.keys(raw).forEach(k=>byId[k.trim()]=raw[k]);MONTHS=ids.map(id=>({id:id,label:monthLabel(id),tasks:parseSheet(byId[id])}));MONTHS.forEach((M,i)=>{const prev=i>0?MONTHS[i-1]:null,next=MONTHS[i+1]||null;const prevOpen=new Map;if(prev)prev.tasks.forEach(t=>{if(!t.done&&!t.routine)prevOpen.set(t.key,t)});const nextKeys=new Set(next?next.tasks.map(t=>t.key):[]);M.tasks.forEach(t=>{const p=prevOpen.get(t.key);t.streak=p?(p.streak||1)+1:1;t.fromPrev=!!p;t.carryOut=!t.done&&!t.routine?next?nextKeys.has(t.key)?"next":"missing":"pending":null})})}const state={month:null,owner:"all",cat:"all",sort:"cat"};function chips(el,opts,key){opts.forEach(([v,l])=>{const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=l;b.setAttribute("aria-pressed",state[key]===v);b.onclick=()=>{state[key]=v;el.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));render()};el.appendChild(b)})}chips($("#f-owner"),[["all","全員"],["yuki","❄️ ゆき"],["nene","🧚 ねね"]],"owner");$("#f-owner").querySelectorAll(".chip").forEach((c,i)=>{if(i)c.classList.add(["","yuki","nene"][i])});chips($("#f-cat"),[["all","すべて"],...CATS.map(c=>[c[0],c[0]])],"cat");chips($("#f-sort"),[["cat","事業ごと"],["owner","担当ごと"],["due","納期が近い順"],["carry","持ち越しが長い順"]],"sort");const catVar=c=>(CATS.find(x=>x[0]===c)||CATS[CATS.length-1])[1];const catCls=c=>({"不動産":"k-fudosan",Design:"k-design",wellness:"k-well","制作外注":"k-out"}[c]||"k-other");const filt=ts=>ts.filter(t=>(state.owner==="all"||t.o===state.owner)&&(state.cat==="all"||t.c===state.cat));const isLatest=()=>state.month===MONTHS[MONTHS.length-1].id;function renderMonths(){$("#months").innerHTML=MONTHS.slice().reverse().map( ength="100" stroke-dasharray="${pct} 100"/>\n    <line x1="${cx}" y1="${cy-r-10}" x2="${cx}" y2="${cy-r+10}" class="tick"/>\n    <circle cx="${cx-r}" cy="${cy}" r="7" style="fill:var(--carry)" class="dot"/>\n    <circle cx="${cx+r}" cy="${cy}" r="7" style="fill:var(--warn)" class="dot"/>\n    <title>${k.map(x=>x[0]+"："+x[2]).join(" / ")}</title>\n    ${T(70,24,"lab",month[0])}${T(70,52,"num "+month[3],month[1])}\n    ${T(310,24,"lab",done[0])}${T(310,52,"num "+done[3],done[1])}\n    ${T(cx-r,190,"lab",prev[0])}${T(cx-r,216,"num "+prev[3],prev[1])}\n    ${T(cx+r,190,"lab",carry[0])}${T(cx+r,216,"num "+carry[3],carry[1])}\n    ${T(cx,82,"pct","完了率 "+pct+"%")}\n    ${T(cx,112,"lab",late[0])}${T(cx,154,"num big "+late[3],late[1])}\n  </svg>`}const sortDue=(a,b)=>(a.due||"9999")<(b.due||"9999")?-1:(a.due||"9999")>(b.due||"9999")?1:0;function render(){const M=MONTHS.find(m=>m.id===state.month);const v=filt(M.tasks);const latest=isLatest();const work=v.filter(t=>!t.routine);const open=work.filter(t=>!t.done);const overdue=latest?open.filter(t=>t.due&&days(t.due)<0):[];const k=[["前月タスク",work.filter(t=>t.fromPrev).length,"前月から持ち越したタスク","carry"],["当月タスク",work.length,"この月のタスク（定常業務を除く）",""],["完了",work.filter(t=>t.done).length,"納品・完了チェック済み","ok"],[latest?"持ち越し見込み":"持ち越し",open.length,latest?"月末までに終わらなければ翌月へ":"この月に終わらなかったもの",open.length?"warn":""],latest?["納期超過",overdue.length,"今日時点で納期を過ぎた未完了",overdue.length?"crit":""]:["シートから消えた",open.filter(t=>t.carryOut==="missing").length,"未完了のまま翌月シートに無いもの",open.some(t=>t.carryOut==="missing")?"crit":""]];$("#kpis").innerHTML=gauge(k,work.length?work.filter(t=>t.done).length/work.length:0);$("#board-h").textContent=`進捗ボード ・ ${M.label}`;$("#board").innerHTML=BOARD.map(col=>{let items=v.filter(t=>!t.routine&&col.sts.includes(t.s));const byDone=(a,b)=>(b.doneDate||"")>(a.doneDate||"")?1:(b.doneDate||"")<(a.doneDate||"")?-1:0;const inner=col.key==="done"?byDone:state.sort==="carry"?(a,b)=>b.streak-a.streak||sortDue(a,b):(a,b)=>sortDue(a,b)||b.stre )=>t+p.sales,0)}});const pipeAmt=pipe.reduce((t,x)=>t+x.amt,0)||1;const months=[];for(let t=new Date(+from.slice(0,4),+from.slice(5,7)-1,1);isoOf(t).slice(0,7)<=to.slice(0,7);t=new Date(t.getFullYear(),t.getMonth()+1,1))months.push(isoOf(t).slice(0,7));const mg=months.map(m=>ok.filter(p=>when(p).slice(0,7)===m).reduce((t,p)=>t+p.gp,0));let acc=0;const cum=mg.map(v=>acc+=v);const F={all:()=>true,open:p=>p.stage==="billed",loss:p=>!p.noCost&&p.gp<0,nc:p=>p.noCost};const list=(st.filter==="open"?all:inP).filter(F[st.filter]).sort((a,z)=>(when(z)||"9999").localeCompare(when(a)||"9999"));const lim=st.more?list.length:15;const nums={all:inP.length,open:all.filter(F.open).length,loss:inP.filter(F.loss).length,nc:nc.length};$("d-led-body").innerHTML=`<span class="span">集計期間：${md(from)}〜${md(to)}（${esc(plabel)}）・月は請求日</span>\n        <div class="tiles"><div class="tile"><div class="k">粗利</div><div class="v">${man(gp)}</div><div class="s">${ok.length}件の合計</div></div>\n          <div class="tile"><div class="k">売上</div><div class="v">${man(sales)}</div><div class="s">粗利率 ${sales?pct(gp/sales):"―"}</div></div>\n          <div class="tile"><div class="k">原価未入力</div><div class="v">${nc.length}件</div><div class="s">売上 ${man(nc.reduce((t,p)=>t+p.sales,0))}（粗利に入れない）</div></div></div>\n        <h3 style="font-size:12px;color:var(--ink-2);margin:14px 0 6px">案件の進み具合</h3>\n        <div class="bar" aria-hidden="true" style="height:14px">${(()=>{let x=0;return pipe.map(s=>{const w=s.amt/pipeAmt*100,h=`<i style="left:${x}%;width:${w}%;background:${SC[s.k]}"></i>`;x+=w;return h}).join("")})()}</div>\n        <div class="pipe" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-top:8px">${pipe.map(s=>`<div><span class="k"><i class="sw" style="background:${SC[s.k]}"></i>${{est:"見積中",work:"施工中",billed:"入金待ち",paid:"入金済"}[s.k]||esc(s.name)}</span><span class="n">${s.n}</span><span class="a">${man(s.amt)}</span></div>`).join("")}</div>\n        <p class="lead" style="margin:6px 0 0">帯の長さ＝ more=false;$(id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()}));seg("d-per","per",Number);seg("d-staff","staff",String);draw()}function renderD(d,el){const g=d.design,lead=g.scope==="lead",live=g.cases.filter(x=>x.stage!=="入金済み");const pipe=g.stages.map(s=>{const c=g.cases.filter(x=>x.stage===s);return`<div><span class="k">${s}</span><span class="n">${c.length}</span><span class="a">${man(c.reduce((t,x)=>t+(x.est||0),0))}</span></div>`}).join("");const noAmt=live.filter(x=>x.est==null).length;let money="";if(lead){const C=g.cash,M=g.months,sum=k=>C[k].reduce((t,x)=>t+x.done,0);const inc=sum("デザイン売上"),out=sum("支払い");const cell=o=>o.done||o.plan?`${man(o.done)}${o.plan?`<small>予定 ${man(o.plan)}</small>`:""}`:"―";const tenpo=sum("入金_転貸立替");const sub=!!C["工務"];money=`<div class="tiles"><div class="tile"><div class="k">${esc(d.period.label)}のデザイン売上（入金）</div><div class="v">${man(inc)}</div><div class="s">${sub?`工務 ${man(sum("工務"))}<br>制作 ${man(sum("制作"))}`:"工務と、外部のお客様からの制作"}</div></div>\n          <div class="tile"><div class="k">${esc(d.period.label)}の外注への支払い</div><div class="v">${man(out)}</div><div class="s">入金との差 ${man(inc-out)}</div></div></div>\n        <div class="panel"><h2>月ごとのデザイン売上（入金）と支払い</h2>${spanTag(d.period)}${colChart(M,[...sub?[{name:"工務",color:"var(--des)",values:C["工務"].map(x=>x.done)},{name:"制作",color:"var(--k5)",values:C["制作"].map(x=>x.done)}]:[{name:"デザイン売上",color:"var(--buy)",values:C["デザイン売上"].map(x=>x.done)}]],{line:{name:"外注への支払い",color:"var(--ink-2)",values:C["支払い"].map(x=>x.done||null)},label:"月ごとのデザイン売上（棒）と外注への支払い（線）"})}<div class="tbl-scroll"><table class="sales"><thead><tr><th>月</th>${sub?`<th class="num">工務</th><th class="num">制作</th>`:""}<th class="num">デザイン売上</th><th class="num">外注へ<br>支払い</th></tr></thead><tbody>\n          ${M.map((m,i)=>`<tr><th scope="row">${esc(m)}</th>${sub?`<td class="num">${cell(C["工務"][i])}</td><td class="num">${cell(C["制作"][i])}</td>`:""}<td class="num"><b>${cell(C["デザイン売上"][i])}</b></td><td class="num">${cell(C["支払い"][i])}</td></tr>`).join("")}\n          <tr class="total"><th scope="row">合計</th>${sub?`<td class="num">${man(sum("工務"))}</td><td class="num">${man(sum("制作"))}</td>`:""}<td class="num"><b>${man(inc)}</b></td><td class="num">${man(out)}</td></tr>\n        </tbody></table></div><p class="lead" style="margin:8px 0 0">デザイン売上＝工務と、外部のお客様からの制作の入金（勘定日の月。予定＝まだ入っていない請求）。居留地グループ内の制作の入金は含めていない。${tenpo?`転貸・立替だけの入金 ${man(tenpo)} も売上ではないので除いている。`:""}支払い＝支払い月のシートの合計（予定＝「済」が空）。お金の出入りで、売上・原価の計上とは別。</p></div>`+`<div class="panel"><h2>前年同期との比較（デザイン売上の入金）</h2>${spanTag(d.period)}${yoyTable(M.map((m,i)=>{const P=g.prev&&g.prev.cash,any=P&&(P["デザイン売上"][i].done||P["支払い"][i].done);return[m,C["デザイン売上"][i].done,any?P["デザイン売上"][i].done:null]}),d.period.prevLabel)}</div>`}const pipeChart=barRows(g.stages.map(s=>({label:s.replace("・"," "),values:[g.cases.filter(x=>x.stage===s).reduce((t,x)=>t+(x.est||0),0)]})),[{name:"見積額",color:"var(--accent)"}],{label:"段階ごとの見積額"});el.innerHTML=`<div class="panel"><h2>案件の進み具合</h2><div class="pipe">${pipe}</div>${pipeChart}${noAmt?`<p class="lead" style="margin:8px 0 0">金額が未入力の進行中の案件：${noAmt}件</p>`:""}<p class="lead" style="margin:4px 0 0">工務案件管理表のステータスから。棒＝段階ごとの見積額の合計。</p></div>${lead?ledPanel(g.ledger):""}${money}\n      <div class="panel"><h2>案件一覧（進行中）</h2>${live.map(x=>`<div class="row">\n        <div class="name">${esc(x.name)} <span class="chip ${x.stage==="見積・商談"?"plain":"info"}">${esc(x.status||x.stage)}</span></div>\n        <div class="amt">${x.est!=null?man(x.est):"―"}${lead&&x.est&&x.cost!=null?`<small>原価 ${man(x.cost)}（粗利 ${pct((x.est-x.cost)/x.est)}）</small>`:lead&&x.rate?`<small>粗利率 ${pct(x.rate)}</small>`:""}</div>\n        <div class="meta">${esc(x.by)}${x.next?` ・ 次：${esc(x.next)}`:""}</div><div class="meta" style="text-align:right">${esc(x.due)}${x.who?`<br>${esc(x.who)}`:""}</div></div>`).join("")}</div>`;if(lead)wireLedger(g.ledger)}})()</script> </body> </html>
